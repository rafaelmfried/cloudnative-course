# OTel Collector recebe OTLP de apps Go/Node e roteia para Tempo (traces),
# Prometheus (métricas, via scrape) e Loki (logs).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Adiciona resource attributes consistentes (env, service.namespace)
  resource:
    attributes:
      - key: service.namespace
        value: cloud-native-course
        action: insert

exporters:
  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Métricas → expostas para Prometheus scrape
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true

  # Logs → Loki via OTLP HTTP
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/loki]

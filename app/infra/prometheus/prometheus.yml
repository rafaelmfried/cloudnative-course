global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Métricas do próprio Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OTel Collector — exporta métricas que apps mandaram via OTLP
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Apps direto (quando módulo expor /metrics próprio)
  # Exemplo:
  # - job_name: ledger-api
  #   static_configs:
  #     - targets: ["host.docker.internal:8080"]

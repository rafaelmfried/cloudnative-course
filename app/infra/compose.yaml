name: cloud-native-course

# Stack de infra compartilhada entre todos os módulos.
# Sobe: Postgres + RabbitMQ + OTel Collector + Prometheus + Grafana + Tempo + Loki.
# Apps (publisher, consumer, etc.) NÃO ficam aqui — cada módulo sobe os seus.

services:
  # ── Persistência ───────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: cnc-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ledger
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Mensageria ─────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: cnc-rabbitmq
    ports:
      - 5672:5672 # AMQP
      - 15672:15672 # Management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ── Telemetria: OTel Collector ─────────────────────────────────────
  # Recebe traces/metrics/logs das apps via OTLP e roteia pra Tempo/Prom/Loki.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0
    container_name: cnc-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - 4317:4317 # OTLP gRPC
      - 4318:4318 # OTLP HTTP
      - 8889:8889 # Prometheus exporter (do collector)
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  # ── Métricas: Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.5.0 # LTS, suportado até jul/2026
    container_name: cnc-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # ── Traces: Tempo ──────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.9.0
    container_name: cnc-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - 3200:3200 # Tempo HTTP query
      - 4319:4317 # OTLP gRPC interno (collector → tempo)

  # ── Logs: Loki ─────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.7.2
    container_name: cnc-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - 3100:3100
    volumes:
      - loki_data:/loki

  # ── UI: Grafana ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.0.1
    container_name: cnc-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - 3000:3000
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:

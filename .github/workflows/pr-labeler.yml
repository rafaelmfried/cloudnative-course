name: PR labeler

# Aplica labels automaticamente em cada PR:
#  - area/* e module/*  → por caminho de arquivo (.github/labeler.yml)
#  - kind/*             → pelo tipo no título Conventional Commit
#  - size/*             → pelo número de linhas alteradas

# pull_request_target (não pull_request): em PR vindo de fork, o
# pull_request roda com GITHUB_TOKEN read-only e a aplicação de label
# falha. pull_request_target roda com token de escrita. É seguro aqui
# porque nenhum job faz checkout do código do PR — só usa a API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── area/* e module/* por caminho ──────────────────────────────────
  path-labels:
    name: Label by path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  # ── kind/* pelo título do PR (Conventional Commit) ─────────────────
  kind-label:
    name: Label kind by title
    runs-on: ubuntu-latest
    steps:
      - name: Derive kind/* from PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e
          type="${TITLE%%:*}"        # tudo antes do ':'
          type="${type%%(*}"          # remove escopo '(...)'
          type="$(echo "$type" | tr -d '[:space:]')"
          case "$type" in
            feat)               kind="kind/feature" ;;
            fix)                kind="kind/fix" ;;
            refactor)           kind="kind/refactor" ;;
            docs)               kind="kind/docs" ;;
            test)               kind="kind/test" ;;
            chore|ci|build|perf|style) kind="kind/chore" ;;
            *)
              echo "Título não segue Conventional Commit reconhecido ('$type') — sem kind/*."
              exit 0
              ;;
          esac
          # Garante que a label exista antes de aplicá-la — gh pr edit
          # --add-label falha se a label não existir no repo (caso de um
          # fork onde o Labels sync ainda não rodou). O create sem --force
          # não sobrescreve a label se ela já existir (cor/descrição
          # ficam a cargo do labels.yml).
          gh label create "$kind" --color 1d76db 2>/dev/null || true
          echo "Aplicando $kind"
          gh pr edit "$PR" --add-label "$kind"

  # ── size/* pelo volume de mudança ──────────────────────────────────
  size-label:
    name: Label size
    runs-on: ubuntu-latest
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          github_token: ${{ github.token }}
          xs_label: "size/XS"
          xs_max_size: "9"
          s_label: "size/S"
          s_max_size: "99"
          m_label: "size/M"
          m_max_size: "499"
          l_label: "size/L"
          l_max_size: "999"
          xl_label: "size/XL"
          message_if_xl: >
            Este PR é grande (1000+ linhas). Considere dividir em PRs
            menores — a metodologia do curso pede commits e PRs enxutos.
          files_to_ignore: "pnpm-lock.yaml go.sum LICENSE"

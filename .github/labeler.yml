# Auto-label de PR por caminho de arquivo (actions/labeler v5).
# Aplica area/* e module/* conforme os arquivos que o PR toca.
# kind/* e size/* são aplicados por outros jobs do pr-labeler.yml.

"area/go":
  - changed-files:
      - any-glob-to-any-file:
          - "app/go/**"
          - "modules/*/go/**"

"area/node":
  - changed-files:
      - any-glob-to-any-file:
          - "app/node/**"
          - "modules/*/node/**"

"area/infra":
  - changed-files:
      - any-glob-to-any-file:
          - "app/infra/**"

"area/ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "commitlint.config.js"
          - ".editorconfig"
          - ".prettierignore"

"area/meta":
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "SYLLABUS.md"
          - "METHODOLOGY.md"
          - "ROADMAP.md"
          - "CONTRIBUTING.md"
          - "CODE_OF_CONDUCT.md"
          - "SECURITY.md"
          - "CHANGELOG.md"

"module/01":
  - changed-files:
      - any-glob-to-any-file: ["modules/01-*/**"]
"module/02":
  - changed-files:
      - any-glob-to-any-file: ["modules/02-*/**"]

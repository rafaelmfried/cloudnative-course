# ── level/ — nível pedagógico (jr → mid → sr) ───────────────────────
- name: "level/jr"
  color: "d4a72c"
  description: "Implementação ingênua — foco no conceito"
- name: "level/mid"
  color: "d4a72c"
  description: "Implementação idiomática — error handling, estrutura"
- name: "level/sr"
  color: "d4a72c"
  description: "Implementação production-ready — observabilidade, edge cases"

# ── size/ — tamanho do PR (aplicada automaticamente) ────────────────
- name: "size/XS"
  color: "c2e0c6"
  description: "PR muito pequeno (< 10 linhas)"
- name: "size/S"
  color: "bfd4f2"
  description: "PR pequeno (10–99 linhas)"
- name: "size/M"
  color: "fbca04"
  description: "PR médio (100–499 linhas)"
- name: "size/L"
  color: "f9a825"
  description: "PR grande (500–999 linhas)"
- name: "size/XL"
  color: "d93f0b"
  description: "PR muito grande (1000+ linhas) — considerar dividir"

# ── do-not-merge/ — bloqueio explícito de merge ─────────────────────
- name: "do-not-merge/wip"
  color: "b60205"
  description: "Trabalho em progresso — não mergear"
- name: "do-not-merge/hold"
  color: "b60205"
  description: "Segurar merge por decisão pendente"

# ── triagem e estado ────────────────────────────────────────────────
- name: "lgtm"
  color: "0e8a16"
  description: "Looks good to me — aplicada via /lgtm"
- name: "needs-triage"
  color: "ededed"
  description: "Issue nova, ainda não avaliada"
- name: "needs-rebase"
  color: "e11d21"
  description: "Branch desatualizada ou com conflito — precisa rebase"
- name: "good first issue"
  color: "7057ff"
  description: "Boa primeira contribuição"
- name: "help wanted"
  color: "008672"
  description: "Ajuda da comunidade é bem-vinda"
- name: "dependencies"
  color: "0366d6"
  description: "Atualização de dependência (Dependabot)"

# ── issue templates ─────────────────────────────────────────────────
- name: "duvida"
  color: "0e8a16"
  description: "Dúvida de módulo"
- name: "erro-material"
  color: "d73a4a"
  description: "Erro, typo ou imprecisão no material"
- name: "sugestao"
  color: "a2eeef"
  description: "Sugestão de melhoria do curso"

# Definição versionada das labels do repositório.
# Sincronizada pelo workflow labels-sync.yml (crazy-max/ghaction-github-labeler).
# Editar aqui é a única forma de criar/alterar label — não criar pela UI.

# ── kind/ — natureza da mudança (espelha Conventional Commits) ──────
- name: "kind/feature"
  color: "1d76db"
  description: "Nova funcionalidade"
- name: "kind/fix"
  color: "1d76db"
  description: "Correção de bug"
- name: "kind/refactor"
  color: "1d76db"
  description: "Mudança sem alterar comportamento"
- name: "kind/docs"
  color: "1d76db"
  description: "Documentação / material didático"
- name: "kind/test"
  color: "1d76db"
  description: "Adição ou ajuste de testes"
- name: "kind/chore"
  color: "1d76db"
  description: "Manutenção, build, CI, deps"

# ── area/ — onde a mudança mexe ─────────────────────────────────────
- name: "area/go"
  color: "0e8a16"
  description: "Aplicação Go"
- name: "area/node"
  color: "0e8a16"
  description: "Aplicação Node"
- name: "area/infra"
  color: "0e8a16"
  description: "Infraestrutura compartilhada (compose, observability)"
- name: "area/ci"
  color: "0e8a16"
  description: "Automação do repositório (workflows, rulesets, configs)"
- name: "area/meta"
  color: "0e8a16"
  description: "Documentos do curso (README, SYLLABUS, METHODOLOGY, ROADMAP)"

